[project]
name = "ensemble-object-detection"
version = "0.1.0"
description = "Scene-adaptive ensemble object detection for UAV imagery: fusion, pool composition, robustness to a compromised member, and the SCAC compute cascade"
requires-python = ">=3.10"
dependencies = [
    # Core ML frameworks
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    # Ensemble methods
    "ensemble-boxes>=1.0.9",
    # Image processing
    "opencv-python>=4.8.0",
    "albumentations>=1.3.0",
    "pillow>=10.0.0",
    # Data & analysis
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    # Experiment tracking
    "wandb>=0.15.0",
    "tqdm>=4.65.0",
    # Configuration
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.0",
    # Utilities
    "gdown>=4.7.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    # In-repo library: the deployable cascade core (libs/scac)
    "scac",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11",
    "ty>=0.0.1a7",
    "pre-commit>=4.0",
    "pycocotools>=2.0.11",
]
profiling = [
    "fvcore>=0.1.5",
    "pynvml>=11.5.0",
    "thop>=0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "libs/scac/tests", "exp36/tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-ra -q"

[tool.uv.sources]
scac = { path = "libs/scac", editable = true }
