[project]
name = "scac"
version = "0.1.0"
description = "Scene-Complexity Adaptive Cascade: annotation-free complexity signals, cross-fitted threshold calibration, oracle feasibility gate and an escalation guard for detector ensembles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vladyslav Kromkach" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
cli = []

[project.scripts]
scac = "scac.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scac"]
